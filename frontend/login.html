<!DOCTYPE html>
<html lang="id" class="h-full bg-zinc-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Abel Bomboloni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            width: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="w-full min-h-[100dvh] flex items-center justify-center bg-zinc-950 antialiased px-4 py-8 relative overflow-x-hidden selection:bg-white selection:text-black">

    <div class="absolute inset-0 bg-[radial-gradient(circle_at_top,_var(--tw-gradient-stops))] from-zinc-800/20 via-zinc-950 to-zinc-950 pointer-events-none"></div>
    <div class="absolute -top-40 -left-40 w-80 h-80 bg-zinc-800/10 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-80 h-80 bg-zinc-800/10 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">
        <div class="flex justify-center mb-6">
            <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs font-semibold tracking-wide">
                <span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>
                Abel Bomboloni
            </div>
        </div>

        <div class="mb-8 text-center space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-white">Masuk</h1>
            <p class="text-zinc-400 text-sm max-w-xs mx-auto">
                Silakan masuk dengan akun Anda untuk mengakses sistem.
            </p>
        </div>

        <div class="bg-zinc-900/80 backdrop-blur-xl border border-zinc-800/80 shadow-2xl shadow-black/80 rounded-3xl p-6 sm:p-8">
            <form id="login-form" class="space-y-5">
                <div class="space-y-2">
                    <label for="email" class="text-xs font-semibold text-zinc-300 uppercase tracking-wider block">Email</label>
                    <div class="relative">
                        <input id="email" type="email" required autocomplete="username" placeholder="nama@email.com"
                            class="w-full px-4 py-3 rounded-xl bg-zinc-950/80 border border-zinc-800 text-zinc-100 text-sm placeholder:text-zinc-600 focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all duration-200" />
                    </div>
                </div>

                <div class="space-y-2">
                    <label for="password" class="text-xs font-semibold text-zinc-300 uppercase tracking-wider block">Password</label>
                    <div class="relative">
                        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••"
                            class="w-full px-4 py-3 pr-11 rounded-xl bg-zinc-950/80 border border-zinc-800 text-zinc-100 text-sm placeholder:text-zinc-600 focus:outline-none focus:border-white focus:ring-1 focus:ring-white transition-all duration-200" />
                        <button type="button" id="toggle-password" tabindex="-1"
                            class="absolute right-0 top-0 h-full px-3.5 flex items-center text-zinc-500 hover:text-zinc-200 transition-colors duration-200">
                            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" class="w-4.5 h-4.5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
                                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 0 1-4.24-4.24"></path>
                                <path d="M6.61 6.61A18.5 18.5 0 0 0 1 12s4 8 11 8a10.44 10.44 0 0 0 5.39-1.61"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <p id="error-text" class="text-xs text-red-400 font-medium bg-red-950/30 border border-red-900/50 rounded-lg p-3 hidden transition-all duration-200"></p>

                <button type="submit" id="submit-btn"
                    class="w-full py-3 px-4 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 text-sm font-bold shadow-lg shadow-white/5 active:scale-[0.98] transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed disabled:active:scale-100">
                    Masuk
                </button>
            </form>
        </div>

        <p class="text-center text-xs text-zinc-600 mt-6">
            &copy; Abel Bomboloni. All rights reserved.
        </p>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const errorText = document.getElementById('error-text');
        const submitBtn = document.getElementById('submit-btn');
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const eyeOpen = document.getElementById('eye-open');
        const eyeClosed = document.getElementById('eye-closed');

        togglePassword.addEventListener('click', () => {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            eyeOpen.classList.toggle('hidden', isHidden);
            eyeClosed.classList.toggle('hidden', !isHidden);
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorText.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Memproses...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password }),
                });
                const data = await res.json();

                if (!res.ok || !data.ok) {
                    errorText.textContent = data.error || 'Gagal masuk.';
                    errorText.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Masuk';
                    return;
                }

                window.location.href = '/';
            } catch (err) {
                errorText.textContent = 'Terjadi kesalahan jaringan.';
                errorText.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Masuk';
            }
        });
    </script>
</body>
</html>
